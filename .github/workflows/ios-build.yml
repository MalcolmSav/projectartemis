name: iOS build (local, free)

# Builds the iOS .ipa on GitHub's macOS runner using `eas build --local`, which
# does NOT consume EAS cloud build credits. Trigger it by hand from the Actions
# tab. Optionally submits to TestFlight afterwards.
#
# Required repo secret: EXPO_TOKEN  (Expo → Account → Access Tokens → create).
# Signing credentials + the App Store Connect submit key are fetched from EAS
# via that token, so nothing else needs to be stored here.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: 'Submit to TestFlight after building'
        type: boolean
        default: true

jobs:
  build:
    # macos-15 ships Xcode 16.x — Expo SDK 54 / RN 0.81 needs Xcode >= 16.1.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build IPA locally (no EAS build credits)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --local --platform ios --profile production --non-interactive --output "$GITHUB_WORKSPACE/artemis.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: artemis-ios-ipa
          path: ${{ github.workspace }}/artemis.ipa
          if-no-files-found: error

      # --no-wait: schedule the submission and exit.
      #
      # By default `eas submit` blocks until EAS Submit finishes, polling
      # api.expo.dev the whole time. The submission is already safely handed off
      # to EAS servers the moment "Scheduled iOS submission" prints — the wait
      # buys nothing, and it fails the step for reasons that have nothing to do
      # with the build. On 2026-08-04 Expo's queue was backed up for over an
      # hour, and 40 minutes into the polling the runner hit a transient
      # `getaddrinfo ENOTFOUND api.expo.dev`; the CLI treats any GraphQL error
      # during the wait as fatal and exited 1. The submission itself completed
      # fine, but the run was red and looked like a failed release.
      #
      # Track the submission at the URL this step prints, or with
      # `eas submit:list --platform ios`.
      - name: Submit to TestFlight
        if: ${{ inputs.submit }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --platform ios --path "$GITHUB_WORKSPACE/artemis.ipa" --profile production --non-interactive --no-wait
